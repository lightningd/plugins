[project]
name = "zmq"
version = "0.1.0"
description = "Forwards notifications to ZeroMQ endpoints depending on configuration"
readme = "README.md"
requires-python = ">=3.11"

dependencies = ["Twisted>=20.3.0", "txzmq==1.0.0", "pyln-client>=26.6.9"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.7,<4",
    "pytest-timeout>=2.4,<3",
    "pyln-testing>=26.6.9",
    "pyln-client>=26.6.9",
    "pyln-proto>=26.6.9",
]
